<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Laundry Management System - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Laundry Management System</h1>

            <p class="subtitle">
                Seller Login
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <div class="auth-links">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

                <span>|</span>

                <a href="register.html">
                    Create Account
                </a>

            </div>


    <div class="footer">

        <p>Developed by Dhruv Khurana</p>

        <div class="footer-links">
            <a href="mailto:dhruvkhurana162@gmail.com">Gmail</a>
            <span>|</span>
            <a href="https://www.linkedin.com/in/dhruv-khurana-756726219/" target="_blank">
                LinkedIn
            </a>
        </div>

    </div>


    <script src="../js/login.js"></script>

</body>

</html>
