<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Laundry Management System</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your seller account
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password">
                        <button type="button" id="toggleConfirmPassword" class="password-toggle">👁</button>
                    </div>

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="message"
                ></p>

            </form>


            <div class="auth-links">

                <span>Already have an account?</span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="footer">

                <p>Developed by Dhruv Khurana</p>

                <div class="footer-links">

                    <a href="mailto:dhruvkhurana1626@gmail.com">
                        Gmail
                    </a>

                    <span>|</span>

                    <a
                        href="https://www.linkedin.com/in/dhruv-khurana-756726219/"
                        target="_blank"
                    >
                        LinkedIn
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/api.js"></script>
    <script src="/js/register.js"></script>

</body>

</html>
