<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Laundry Management System</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>

<body>

    <div class="forgot-container">

        <div class="forgot-content">

            <!-- =========================
                 DEVELOPER BADGE
            ========================== -->

            <div class="developer-badge">

                <div class="developer-line">

                    <span class="line-dot"></span>

                    <span>Built by</span>

                    <span class="developer-name">
                        Dhruv Khurana
                    </span>

                    <span class="line-dot"></span>

                </div>


                <div class="developer-links">

                    <a
                        href="mailto:dhruvkhurana1626@gmail.com"
                        class="developer-link"
                    >
                        Gmail
                    </a>

                    <span class="developer-divider">
                        •
                    </span>

                    <a
                        href="https://www.linkedin.com/in/dhruv-khurana-756726219/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="developer-link"
                    >
                        LinkedIn
                    </a>

                </div>

            </div>


            <!-- =========================
                 FORGOT PASSWORD CARD
            ========================== -->

            <div class="forgot-card">

                <h1>
                    Forgot Password?
                </h1>


                <p class="subtitle">
                    Enter your email and <br> we'll send you a password reset link.
                </p>


                <form id="forgotPasswordForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="forgot-button"
                    >
                        Send Reset Link
                    </button>


                    <p
                        id="forgotMessage"
                        class="message"
                    ></p>

                </form>


                <div class="back-link">

                    <a href="login.html">
                        ← Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="/js/api.js"></script>
    <script src="/js/forgot-password.js"></script>

</body>

</html>
