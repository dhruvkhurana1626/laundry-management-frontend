<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Laundry Management System</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/profile.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            Laundry Management
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="pricing.html">
                Pricing
            </a>

            <a href="profile.html" class="active">
                Profile
            </a>

            <button
                type="button"
                id="logoutButton"
            >
                Logout
            </button>

        </nav>

    </header>


    <!-- Main Content -->

    <main class="profile-container">

        <section class="profile-header">

            <h1>My Profile</h1>

            <p>
                Manage your personal and business information.
            </p>

        </section>


        <form id="profileForm">

            <!-- Personal Information -->

            <section class="profile-card">

                <div class="section-header">

                    <h2>Personal Information</h2>

                    <p>
                        Your account information.
                    </p>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            readonly
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            readonly
                        >

                    </div>

                </div>

            </section>


            <!-- Business Information -->

            <section class="profile-card">

                <div class="section-header">

                    <h2>Business Information</h2>

                    <p>
                        Information about your laundry business.
                    </p>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="businessName">
                            Business Name
                        </label>

                        <input
                            type="text"
                            id="businessName"
                            placeholder="Enter business name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="ownerName">
                            Owner Name
                        </label>

                        <input
                            type="text"
                            id="ownerName"
                            placeholder="Enter owner name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter city"
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="address">
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter business address"
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="aboutBusiness">
                            About Business
                        </label>

                        <textarea
                            id="aboutBusiness"
                            rows="4"
                            placeholder="Tell customers about your business"
                        ></textarea>

                    </div>

                </div>

            </section>


            <!-- Business Documents -->

            <section class="profile-card">

                <div class="section-header">

                    <h2>Business Documents</h2>

                    <p>
                        Optional business identification details.
                    </p>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="panNumber">
                            PAN Number
                        </label>

                        <input
                            type="text"
                            id="panNumber"
                            placeholder="Enter PAN number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="gstNumber">
                            GST Number
                        </label>

                        <input
                            type="text"
                            id="gstNumber"
                            placeholder="Enter GST number"
                        >

                    </div>

                </div>

            </section>


            <!-- Save Changes -->

            <div class="form-actions">

                <button
                    type="submit"
                    id="saveButton"
                    class="save-button"
                >
                    Save Changes
                </button>

                <button
                        type="button"
                        id="changePasswordPageButton"
                        class="save-button"
                        onclick="window.location.href='change-password.html'"
                    >
                        Change Password
                </button>

                <p
                    id="profileMessage"
                    class="message"
                ></p>

            </div>

        </form>

    </main>


    <!-- JavaScript -->

    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>

</body>

</html>
