<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Laundry Management System</title>

    <link rel="stylesheet" href="../css/reset-password.css">
</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <h1>Reset Password</h1>

            <p class="subtitle">
                Create a new password for your account.
            </p>

            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        required
                        minlength="8"
                    >

                </div>


                <button
                    type="submit"
                    class="reset-button"
                >
                    Reset Password
                </button>


                <p
                    id="resetMessage"
                    class="message"
                ></p>

            </form>


            <div class="back-link">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>


            <div class="footer">

                <p>Developed by Dhruv Khurana</p>

                <div class="footer-links">

                    <a href="mailto:dhruvkhurana1626@gmail.com">
                        Gmail
                    </a>

                    <span>|</span>

                    <a
                        href="https://www.linkedin.com/in/dhruv-khurana-756726219/"
                        target="_blank"
                    >
                        LinkedIn
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="../js/reset-password.js"></script>

</body>

</html>
